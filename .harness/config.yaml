llm:
  provider: openai
  model: deepseek-chat
  baseUrl: https://api.deepseek.com
  maxTokens: 4096
  temperature: 0.1
agent:
  maxTurns: 50
  timeout: 300000
governance:
  rulesFile: .harness/guardrails.yaml
  sandbox:
    allowedPaths:
      - ./
    allowedCommands:
      - npm
      - node
      - npx
      - tsc
      - eslint
      - vitest
      - jest
      - git
      - ls
      - pwd
      - cat
      - echo
      - head
      - tail
memory:
  storagePath: .harness/memory/
  maxConversationTurns: 20